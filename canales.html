<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmisiones en Vivo por Región</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        select { padding: 10px; font-size: 16px; margin: 20px 0; background: #222; color: #fff; border: 1px solid #444; border-radius: 5px; width: 100%; max-width: 400px; }
        .video-container { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; background: #000; border-radius: 8px; overflow: hidden; }
        iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>Canales de Noticias en Vivo</h2>
    
    <!-- Selector dinámico -->
    <select id="channelSelect" onchange="changeChannel()">
        <option value="">Selecciona un canal...</option>
    </select>

    <!-- Reproductor de YouTube -->
    <div class="video-container">
        <iframe id="ytPlayer" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
</div>

<script>
    // Tu estructura JSON con los IDs de los canales de YouTube (usando el formato live_stream para transmisiones en vivo)
    const channelsData = {
        "Europa": [
            { "name": "Euronews Español", "id": "UCQFWwZFo23qXz25p9v8B8tA" },
            { "name": "DW Español", "id": "UC6c9S47Vp0X0wQkZk1c_3Jg" }
        ],
        "Japón": [
            { "name": "NHK World Japan", "id": "UC8-w0D_6_uJ0z2z_4nS_2uQ" }
        ],
        "Sur América": [
            { "name": "TN (Todo Noticias)", "id": "UCrW06P-uNnO4B6d156t_6xQ" }
        ]
    };

    // Llenar el menú desplegable automáticamente desde el JSON
    const selectElement = document.getElementById("channelSelect");

    for (let region in channelsData) {
        let optgroup = document.createElement("optgroup");
        optgroup.label = region;

        channelsData[region].forEach(channel => {
            let option = document.createElement("option");
            option.value = channel.id;
            option.textContent = channel.name;
            optgroup.appendChild(option);
        });

        selectElement.appendChild(optgroup);
    }

    // Función que cambia el video del iframe al seleccionar un canal
    function changeChannel() {
        const channelId = selectElement.value;
        const iframe = document.getElementById("ytPlayer");
        
        if (channelId) {
            // Usamos el endpoint live_stream para asegurar que cargue la señal en vivo actual del canal
            // rel=0 y modestbranding=1 reducen canales sugeridos externos
            iframe.src = `https://www.youtube.com/embed/live_stream?channel=${channelId}&rel=0&modestbranding=1&autoplay=1`;
        } else {
            iframe.src = "";
        }
    }
</script>

</body>
</html>
