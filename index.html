<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Global en Vivo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { 
            width: 100%; 
            height: 100%; 
            background: #0b0b0b; 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        
        #top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 1000;
        }

        .brand {
            color: #fff;
            font-weight: 600;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        select { 
            background: #222; 
            color: #fff; 
            padding: 8px 12px; 
            border: 1px solid #444; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 14px;
            outline: none;
            max-width: 220px;
        }
        select option { background: #222; color: #fff; }

        #video-wrapper { 
            position: absolute; 
            top: 60px; 
            left: 0; 
            width: 100vw; 
            height: calc(100vh - 60px); 
            background: #000;
        }
        
        iframe { 
            width: 100%; 
            height: 100%; 
            border: 0; 
        }
    </style>
</head>
<body>

<div id="top-bar">
    <div class="brand">
        <span>🌍</span> <span>Global TV</span>
    </div>
    <select id="channelSelect" onchange="changeChannel()">
        <option value="">Selecciona un canal...</option>
    </select>
</div>

<div id="video-wrapper">
    <iframe id="ytPlayer" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
</div>

<script>
    const channels = {
        "Espacio & Ciencia": [
            { "name": "NASA TV", "id": "NASA" }
        ],
        "Europa": [
            { "name": "Euronews Español", "id": "euronewsES" },
            { "name": "DW Español", "id": "dwespanol" },
            { "name": "France 24 Español", "id": "france24espanol" }
        ],
        "Rusia": [
            { "name": "Rossiya 24", "id": "vesti_news" }
        ],
        "Japón": [
            { "name": "NHK World Japan", "id": "NHKWORLDJAPAN" }
        ],
        "China": [
            { "name": "CGTN Español", "id": "CGTNEspanol" }
        ],
        "México": [
            { "name": "N+ Noticias", "id": "nmas" },
            { "name": "Milenio", "id": "milenio" }
        ]
    };

    const select = document.getElementById("channelSelect");

    for (let region in channels) {
        let optgroup = document.createElement("optgroup");
        optgroup.label = region;
        channels[region].forEach(c => {
            let opt = document.createElement("option");
            opt.value = c.id;
            opt.text = c.name;
            optgroup.appendChild(opt);
        });
        select.appendChild(optgroup);
    }

    if (select.options.length > 1) {
        select.selectedIndex = 1;
        changeChannel();
    }

    function changeChannel() {
        const handle = select.value;
        if(handle) {
            // Usando la ruta directa orientada a canales con identificador personalizado (@)
            document.getElementById("ytPlayer").src = `https://www.youtube.com/embed/live_stream?channel_id=${handle}`;
        }
    }
</script>
</body>
</html>
