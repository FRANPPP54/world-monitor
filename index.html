<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Global en Vivo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { 
            width: 100%; 
            height: 100%; 
            background: #0b0b0b; 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        
        /* Barra superior de control elegante y visible */
        #top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 1000;
        }

        .brand {
            color: #fff;
            font-weight: 600;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        select { 
            background: #222; 
            color: #fff; 
            padding: 8px 12px; 
            border: 1px solid #444; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 14px;
            outline: none;
            max-width: 220px;
        }
        select option { background: #222; color: #fff; }

        /* Contenedor del video adaptado a pantalla completa debajo de la barra */
        #video-wrapper { 
            position: absolute; 
            top: 60px; 
            left: 0; 
            width: 100vw; 
            height: calc(100vh - 60px); 
            background: #000;
        }
        
        iframe { 
            width: 100%; 
            height: 100%; 
            border: 0; 
        }
    </style>
</head>
<body>

<div id="top-bar">
    <div class="brand">
        <span>🌍</span> <span>Global TV</span>
    </div>
    <select id="channelSelect" onchange="changeChannel()">
        <option value="">Selecciona un canal...</option>
    </select>
</div>

<div id="video-wrapper">
    <iframe id="ytPlayer" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
</div>

<script>
    const channels = {
        "Espacio & Ciencia": [
            { "name": "NASA TV", "id": "UCLA_DiR1FfKNvjuUp_fYQNA" }
        ],
        "Europa": [
            { "name": "Euronews Español", "id": "UCQFWwZFo23qXz25p9v8B8tA" },
            { "name": "DW Español", "id": "UC6c9S47Vp0X0wQkZk1c_3Jg" },
            { "name": "France 24 Español", "id": "UCQJ62vTZcnv9w7Xm4pM_J1Q" }
        ],
        "Rusia": [
            { "name": "Rossiya 24 (Vesti)", "id": "UCWq-r6T8_hKjzqGzN3rG1hA" }
        ],
        "Japón": [
            { "name": "NHK World Japan", "id": "UC8-w0D_6_uJ0z2z_4nS_2uQ" },
            { "name": "ANNnewsCH", "id": "UCGCZAYq5Xxojl_tSXcVJhiQ" }
        ],
        "China": [
            { "name": "CGTN Español", "id": "UCgrNz-aDmjal2sUO2GyQ_YQ" }
        ],
        "México": [
            { "name": "N+ Noticias", "id": "UC5767fP27fPq6cO450u6s4w" },
            { "name": "Milenio Televisión", "id": "UC8-16WlM5h_w4b0f9Z0Hw5A" }
        ],
        "Centro América": [
            { "name": "TVN Noticias (Panamá)", "id": "UC4W8q5c6uO6L64u5J3uW8vA" },
            { "name": "Telenoticias (Costa Rica)", "id": "UCG1hV_2uJ6p6wZ4u2J6vK0A" }
        ],
        "Sur América": [
            { "name": "TN (Todo Noticias - Argentina)", "id": "UCrW06P-uNnO4B6d156t_6xQ" },
            { "name": "Caracol Televisión (Colombia)", "id": "UCv3N3l1w5t06yZ9b7f5H6wA" },
            { "name": "GloboNews (Brasil)", "id": "UCQz0s3O9-k3k2K8u4W5f2Gg" }
        ]
    };

    const select = document.getElementById("channelSelect");

    // Llenar el menú desplegable ordenado por categorías
    for (let region in channels) {
        let optgroup = document.createElement("optgroup");
        optgroup.label = region;
        channels[region].forEach(c => {
            let opt = document.createElement("option");
            opt.value = c.id;
            opt.text = c.name;
            optgroup.appendChild(opt);
        });
        select.appendChild(optgroup);
    }

    // Cargar automáticamente el primer canal (NASA) al abrir la página para que no quede en negro
    if (select.options.length > 1) {
        select.selectedIndex = 1;
        changeChannel();
    }

    function changeChannel() {
        const id = select.value;
        if(id) {
            document.getElementById("ytPlayer").src = `https://www.youtube.com/embed/live_stream?channel=${id}&rel=0&autoplay=1&modestbranding=1&controls=1`;
        }
    }
</script>
</body>
</html>
