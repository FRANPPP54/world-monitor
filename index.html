<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de YouTube Dinámico</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        .player-container {
            position: relative;
            width: 80%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            margin: 20px auto;
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .buttons {
            margin-top: 20px;
        }
        button {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>

    <h1>Reproductor Dinámico</h1>
    
    <!-- Contenedor del Iframe -->
    <div class="player-container">
        <iframe id="youtubePlayer" src="https://www.youtube.com/embed/dQw4w9WgXcQ" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>

    <!-- Botones para cambiar de canal / video -->
    <div class="buttons">
        <button onclick="changeChannel('dQw4w9WgXcQ')">Video 1</button>
        <button onclick="changeChannel('9bZkp7q19f0')">Video 2</button>
        <button onclick="changeChannel('jfKfPfyJRdk')">Video 3 (Lo-Fi)</button>
    </div>

    <script>
        // Función corregida y actualizada para cambiar el video mediante el ID
        function changeChannel(videoId) {
            const player = document.getElementById('youtubePlayer');
            // Construye la URL de incrustación compatible actual con reproducción automática opcional
            player.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
        }
    </script>

</body>
</html>
