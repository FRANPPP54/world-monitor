<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Monitor - Noticias en Vivo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f1115;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            text-align: center;
        }

        .dashboard-container {
            max-width: 900px;
            margin: 0 auto;
            background: #181b22;
            border-radius: 12px;
            border: 1px solid #2a2e39;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .header-bar {
            background: #1e222b;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            border-bottom: 1px solid #2a2e39;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #ff3333;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #ff3333;
        }

        .channels-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 10px;
            background: #14171f;
            border-bottom: 1px solid #2a2e39;
            justify-content: center;
        }

        .channel-btn {
            background-color: #222632;
            color: #a0aec0;
            border: 1px solid #2f3545;
            padding: 8px 14px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .channel-btn:hover {
            background-color: #2f3545;
            color: #ffffff;
        }

        .channel-btn.active {
            background-color: #e53e3e;
            color: #ffffff;
            border-color: #e53e3e;
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Cabecera -->
        <div class="header-bar">
            <span class="live-dot"></span> NOTICIAS EN VIVO <span style="color: #a0aec0; font-weight: normal;">• 93</span>
        </div>

        <!-- Botones de Canales -->
        <div class="channels-bar">
            <!-- Reemplaza estos IDs con los de las transmisiones en vivo actuales de cada canal -->
            <button class="channel-btn active" onclick="changeChannel('iEpJwbN9YcM', this)">BLOOMBERG</button>
            <button class="channel-btn" onclick="changeChannel('9Auq9mYxFEE', this)">SKYNEWS</button>
            <button class="channel-btn" onclick="changeChannel('sPgqEHsONK8', this)">EURONEWS</button>
            <button class="channel-btn" onclick="changeChannel('Nv2tZFvFVxc', this)">DW</button>
            <button class="channel-btn" onclick="changeChannel('pb8_WOph_Dc', this)">CNBC</button>
        </div>

        <!-- Reproductor -->
        <div class="video-container">
            <iframe id="newsPlayer" src="https://www.youtube.com/embed/iEpJwbN9YcM?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        function changeChannel(videoId, buttonElement) {
            const player = document.getElementById('newsPlayer');
            player.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;

            const buttons = document.querySelectorAll('.channel-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');
        }
    </script>

</body>
</html>
