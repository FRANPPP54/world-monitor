<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Monitor</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; margin: 0; }
        header { padding: 15px; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 10px; }
        #dashboard { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
            gap: 15px; 
            padding: 15px; 
        }
        .card { 
            background: #161b22; 
            border: 1px solid #30363d; 
            border-radius: 8px; 
            padding: 15px; 
        }
        h2 { margin-top: 0; font-size: 1.2rem; color: #58a6ff; }
    </style>
</head>
<body>
    <header><h1>🌍 World Monitor</h1></header>
    <div id="status" style="padding: 20px;">Cargando sistema...</div>
    <div id="dashboard"></div>
    <script src="main.js"></script>
</body>
</html>
